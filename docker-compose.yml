# Local Redis for core-api and core-worker. Postgres and Auth come from the local Supabase
# stack (`pnpm exec supabase start`), so the auth schema matches the hosted platform.
services:
  redis:
    image: redis:8.6.8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data

volumes:
  redis-data:
