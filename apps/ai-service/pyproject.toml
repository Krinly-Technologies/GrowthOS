[project]
name = "ai-service"
version = "0.0.0"
description = "Krinly GrowthOS internal AI service: reasoning and structured action proposals."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162,<0.164",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "langgraph>=1.2,<1.3",
  "httpx>=0.28,<0.29",
  "sentry-sdk[fastapi]>=2.74,<3",
]

[project.optional-dependencies]
langfuse = ["langfuse>=5.1,<6"]

[dependency-groups]
dev = [
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<2.5",
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.3,<2",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain policy matching pnpm's minimum release age: resolve only releases older than
# this cutoff. Move it forward deliberately when upgrading.
exclude-newer = "2026-11-10T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
