name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public build-time values for the Next.js apps. Real values come from Railway at deploy time.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  NEXT_PUBLIC_CORE_API_URL: http://localhost:4000
  NEXT_PUBLIC_MERCHANT_APP_URL: http://localhost:3000

jobs:
  typescript:
    name: TypeScript (format, lint, types, unit, build, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contracts are up to date
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts || {
            echo "::error::Generated contracts are stale. Run 'pnpm contracts:generate' and commit."
            exit 1
          }
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  python:
    name: Python (ruff, mypy, pytest, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --all-extras --no-hashes --no-emit-project -o requirements.txt
          uvx pip-audit==2.10.1 --strict -r requirements.txt

  integration:
    name: Integration (Supabase, Redis, cross-service contract)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.6.8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --directory apps/ai-service
      - name: Start local Supabase (applies migrations and the local seed)
        run: |
          echo '[]' > supabase/signing_keys.json
          pnpm exec supabase gen signing-key --algorithm ES256 --append
          pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,storage-api,realtime,edge-runtime
      - run: pnpm test:integration
      - if: always()
        run: pnpm exec supabase stop --no-backup

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "$base/$tarball" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - run: ./gitleaks git --redact --verbose --exit-code 1

  images:
    name: Container image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-api
            context: .
            file: infrastructure/docker/node-service.Dockerfile
            args: SERVICE=core-api
          - name: core-worker
            context: .
            file: infrastructure/docker/node-service.Dockerfile
            args: SERVICE=core-worker
          - name: merchant-web
            context: .
            file: infrastructure/docker/next-app.Dockerfile
            args: APP=merchant-web
          - name: admin-web
            context: .
            file: infrastructure/docker/next-app.Dockerfile
            args: APP=admin-web
          - name: landing-web
            context: .
            file: infrastructure/docker/next-app.Dockerfile
            args: APP=landing-web
          - name: ai-service
            context: apps/ai-service
            file: apps/ai-service/Dockerfile
            args: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.args }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CORE_API_URL=${{ env.NEXT_PUBLIC_CORE_API_URL }}
            NEXT_PUBLIC_MERCHANT_APP_URL=${{ env.NEXT_PUBLIC_MERCHANT_APP_URL }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
