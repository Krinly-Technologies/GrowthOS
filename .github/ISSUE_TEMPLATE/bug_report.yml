name: Bug report
description: Something is broken or behaving incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's broken
      description: Observed behaviour vs. expected behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Who is driving this (leave blank if unassigned).
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - blocking
        - P1 - high
        - P2 - normal
        - P3 - low
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other issues/PRs this is blocked by or blocks. Write "None" if there are none.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be considered fixed.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: What test(s) will prove the fix and prevent regression.
    validations:
      required: true
