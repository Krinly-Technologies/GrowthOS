name: Feature / task
description: New functionality or planned work.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What and why
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Who is driving this (leave blank if unassigned).
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - blocking
        - P1 - high
        - P2 - normal
        - P3 - low
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other issues/PRs this is blocked by or blocks. Write "None" if there are none.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: What test(s) will cover this.
    validations:
      required: true
